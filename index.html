<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141b24" />
    <meta
      name="description"
      content="Alpha Archive，《阿尔法战区》世界观档案。查阅组织、地点、异常物质与录音线索。"
    />
    <title>Alpha Archive · 阿尔法战区档案</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">跳至正文</a>
    <header class="site-header" id="siteHeader">
      <button
        class="icon-button menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="打开导航"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <a class="site-brand" href="?page=index" aria-label="Alpha Archive 首页">
        <svg class="brand-symbol" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3 29 27H3Z" />
          <path d="m16 12 7 12H9ZM16 3v9" />
        </svg>
        <span>Alpha Archive<small>阿尔法战区 · 世界观档案</small></span>
      </a>
      <div class="search" id="searchBox" role="search">
        <label class="sr-only" for="searchInput">搜索档案</label>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" />
        </svg>
        <input
          id="searchInput"
          type="search"
          placeholder="搜索名称、编号、线索…"
          autocomplete="off"
          aria-controls="searchResults"
          aria-expanded="false"
        />
        <button id="clearSearch" class="icon-button" type="button" aria-label="清空搜索" hidden>
          ×
        </button>
        <kbd class="search-shortcut" aria-hidden="true">Ctrl K</kbd>
        <div class="search-panel" id="searchPanel" hidden>
          <p id="searchStatus" class="search-status" role="status"></p>
          <ul id="searchResults" class="search-results"></ul>
        </div>
      </div>
      <button
        class="icon-button reading-toggle"
        id="readingToggle"
        type="button"
        aria-label="切换专注阅读"
        aria-pressed="false"
        title="专注阅读"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h7l2 2 2-2h7v15h-7l-2 2-2-2H3ZM12 6v15" />
        </svg>
      </button>
    </header>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="档案导航">
      <div class="sidebar-heading">
        <span>档案索引</span
        ><button
          class="icon-button drawer-close"
          id="closeMenu"
          type="button"
          aria-label="关闭导航"
        >
          ×
        </button>
      </div>
      <nav id="sidebarNav" aria-label="主导航">
        <p class="muted sidebar-loading">正在加载目录…</p>
      </nav>
      <div class="sidebar-note">
        <span class="status-dot" aria-hidden="true"></span>虚构世界 · 公开阅读
        <p>保密等级与涂黑为世界观表现，不代表访问权限。</p>
      </div>
    </aside>
    <div class="workspace" id="workspace">
      <main id="mainContent" tabindex="-1" aria-busy="true">
        <div class="state-panel" role="status">
          <span class="loading-mark" aria-hidden="true"></span>
          <h1>正在打开档案</h1>
          <p>准备目录与正文…</p>
        </div>
      </main>
      <footer class="site-footer">
        <span>Alpha Archive</span><span>《Alpha Zone》虚构世界观资料 · Ethernos Studio</span
        ><a href="?view=all">浏览全部档案</a>
      </footer>
    </div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript
      ><p class="noscript">
        此档案站需要 JavaScript 加载内容。你也可以直接阅读
        <a href="pages/index.md">作品简介 Markdown</a>。
      </p></noscript
    >
  </body>
</html>
